name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile check
        run: python -m py_compile main.py

      - name: Check metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^name:' metadata.yaml
          grep -q '^version:' metadata.yaml
          grep -q '^author:' metadata.yaml
          echo "metadata OK"

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'sk-[A-Za-z0-9]{20,}' --exclude-dir=.git .; then
            echo "发现疑似 API Key，终止"
            exit 1
          fi
          echo "no secrets found"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(sed -n 's/^name:[[:space:]]*//p' metadata.yaml | head -n1)"
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' metadata.yaml | head -n1)"
          mkdir -p "dist/${NAME}-${VERSION}"
          cp main.py metadata.yaml README.md "dist/${NAME}-${VERSION}/"
          ( cd dist && zip -r "${NAME}-${VERSION}.zip" "${NAME}-${VERSION}" )
          ls -lh dist
